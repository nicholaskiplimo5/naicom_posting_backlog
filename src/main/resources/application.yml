server:
  port: ${SERVER_PORT:8090}
  # Let an in-flight backlog run finish its current work before the datasource and transaction
  # manager are torn down. Without this a restart mid-run kills every in-flight policy with
  # "IO Error" and the failure log cannot be written ("singletons of this factory are in
  # destruction"), which is exactly what produced the 2026-09-08 15:09 error burst.
  shutdown: graceful

spring:
  lifecycle:
    timeout-per-shutdown-phase: ${SHUTDOWN_GRACE:120s}
  application:
    name: naicom-backlog-poster
  datasource:
    url: ${DB_URL:jdbc:oracle:thin:@//10.6.12.85:1521/TQPDB}
    username: ${DB_USERNAME:TQ_EXC}
    password: ${DB_PASSWORD:EXC_2024}
    driver-class-name: oracle.jdbc.OracleDriver
    hikari:
      connection-timeout: 60000
      # Must comfortably exceed naicom.backlog.max-concurrency: each in-flight poster briefly
      # holds a connection per DAO call, and a pool of 5 stalls a concurrent run immediately.
      maximum-pool-size: ${DB_POOL_SIZE:40}
      minimum-idle: 5
      data-source-properties:
        # Oracle's JDBC default is 10 rows per network round trip. Measured worth ~7% on the
        # backlog cursor - useful, but small; the backlog select is bounded by its own query,
        # not by the network. Applies to every query, not just the backlog select.
        defaultRowPrefetch: 1000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        dialect: org.hibernate.dialect.OracleDialect
        format_sql: true
    show-sql: false

naicom:
  backlog:
    # Policies handled per /postbacklog call. Bounds both the run time and the response size;
    # posted policies leave the selection, so repeated calls walk the backlog down.
    default-limit: ${BACKLOG_LIMIT:1000}
    # Policies posted at once. The run is dominated by the NAICOM round trip, so this is the
    # dial that decides throughput. Raise it until NAICOM (not this app) becomes the limit.
    default-concurrency: ${BACKLOG_CONCURRENCY:8}
    max-concurrency: ${BACKLOG_MAX_CONCURRENCY:32}
    retry:
      # A failed policy is put through the whole pipeline again - re-selected, re-staged and
      # re-posted - rather than just re-posted, so nothing is inherited from the failed attempt.
      # Only NAICOM-side errors that clear on their own are retried: a timeout is not (the request
      # may already have been applied) and neither is a missing-details rejection (it fails the
      # same way every time). Set to 1 to switch retrying off.
      # Total goes per policy, not extra ones: 3 is the first attempt plus two retries,
      # and 1 switches retrying off. A plain counted loop, so this is a hard ceiling.
      max-attempts: ${BACKLOG_RETRY_ATTEMPTS:3}
      delay-ms: ${BACKLOG_RETRY_DELAY_MS:2000}
  http:
    # Idle connections kept alive for reuse; keep >= max-concurrency to avoid a TLS
    # handshake on nearly every post.
    max-idle-connections: ${NAICOM_HTTP_POOL:64}
    keep-alive-minutes: 5

  # Set to false once the NAICOM endpoint presents a certificate that can be
  # validated normally. Kept true by default to match the working behaviour
  # of the existing tps-apis integration (which disables TLS verification
  # for this specific call), and is called out clearly in the docs/logs.
  trust-all-ssl: true

logging:
  file:
    name: logs/${spring.application.name}.log
  pattern:
    console: '%d{yyyy-MM-dd HH:mm:ss} %-5level %logger{36} - %msg%n'
    file: '%d{yyyy-MM-dd HH:mm:ss} %-5level [%thread] %logger{36} - %msg%n'
  level:
    root: INFO
    # DEBUG here writes the full staged payload and the full NAICOM request for every policy.
    # Over a 200k-policy backlog that is gigabytes of log I/O on the posting threads' critical
    # path. Set BACKLOG_LOG_LEVEL=DEBUG for a single diagnostic run instead.
    com.turnkey.naicombacklog: ${BACKLOG_LOG_LEVEL:INFO}
    org.hibernate.SQL: WARN
